info:
  title: Mark43 Partnerships API
  version: external
  description: >-
    Mark43's Partnerships (External) API lets approved law-enforcement technology partners
    integrate with a Mark43 agency's cloud RMS and CAD: create and read reports, persons,
    evidence and chain-of-custody, attachments, CAD events, warrants, tasks, users, and E911
    data. REST over HTTPS with JSON payloads and HTTP Basic authentication using secure API tokens.
  x-provenance:
    method: derived
    source: https://developers.mark43.com/
    generated: '2026-07-20'
servers:
  - url: https://{department}.mark43.com/partnerships/api
    description: Per-agency Mark43 tenant. Replace {department} with your agency subdomain.
    variables:
      department:
        default: department
        description: Your agency's Mark43 tenant subdomain.
