aid: mark43
name: Mark43
description: >-
  Mark43 is a cloud-native public safety software company whose platform unifies
  computer-aided dispatch (CAD), records management (RMS), first-responder mobile
  applications, evidence and property management, and analytics for law enforcement
  and public safety agencies. Serving more than 300 federal, state, and local
  agencies, Mark43 exposes a Partnerships (External) API that lets approved
  location providers, community-engagement software, and other law-enforcement
  technologies integrate directly with an agency's Mark43 tenant. The REST API
  provides endpoints for reports, persons, evidence and chain-of-custody,
  attachments, CAD events and configuration, warrants, tasks, users, vehicles,
  and E911 data, secured with HTTP Basic authentication using agency-issued API
  tokens and returning a consistent JSON response envelope.
